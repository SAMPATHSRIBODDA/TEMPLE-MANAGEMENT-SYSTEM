kind = "web"
previewPath = "/"
title = "TempleSphere Website"
version = "1.0.0"
id = "artifacts/templesphere"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25645

[services.development]
run = "pnpm --filter @workspace/templesphere run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/templesphere", "run", "build" ]
publicDir = "artifacts/templesphere/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25645"
BASE_PATH = "/"
